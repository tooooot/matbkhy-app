name: ci
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=CORE_APP_KEY=${{ secrets.CORE_APP_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: web, path: build/web }
