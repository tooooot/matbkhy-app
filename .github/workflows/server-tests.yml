name: server-tests
on:
  push:
    paths: ['server/**', '.github/workflows/server-tests.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --no-warnings --test server/test/api.test.js
