name: iOS → TestFlight (مطبخي)

# الأسرار المطلوبة: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (محتوى .p8), APPLE_TEAM_ID
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'ارفع إلى TestFlight (وإلا يُبنى فقط للتحقق)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign --dart-define=CORE_APP_KEY=${{ secrets.CORE_APP_KEY }}
          ruby tools/ios_register.rb
      - name: Install App Store Connect API key
        if: ${{ inputs.upload }}
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          sed -i '' "s/__TEAM_ID__/${TEAM_ID}/" ci/ExportOptions.plist
      - name: Archive
        if: ${{ inputs.upload }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
      - name: Export & upload to App Store Connect
        if: ${{ inputs.upload }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Build only (no signing) — verification
        if: ${{ !inputs.upload }}
        run: |
          flutter build ios --release --no-codesign --dart-define=CORE_APP_KEY=${{ secrets.CORE_APP_KEY }}
      - name: Remove key
        if: always()
        run: rm -rf ~/private_keys
